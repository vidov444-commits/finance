<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личные финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#eef1f6; --card:#fff; --line:#e3e7ee; --line2:#f1f3f7; --line3:#c3ccdb;
  --tx:#1b2028; --tx2:#828b9c; --acc:#2f6fed;
  --in:#12a05c; --out:#e0405a; --warn:#c8880f;
  --pink:#f7e7f5; --orange:#fdeddc; --blue:#e4ecfd; --green:#e1f2e8;
  --pinkD:#9c5397; --orangeD:#b3712a; --blueD:#3a63c0; --greenD:#2b855a;
  --sh:0 1px 2px rgba(20,30,50,.04), 0 6px 20px rgba(20,30,50,.05);
  --inp:#fff; --soft:#f7f9fc; --foot:#fafbfd; --chip:#f0f3f8; --hover:#f5f8fd;
  --today:#fff8e3; --bar:#eef1f6; --ghost:#e3e8f1; --scroll:#d5dbe6;
  --soon:#fdf1d6; --late:#fde4e8;
}
html[data-theme="dark"]{
  --bg:#11151c; --card:#1a1f29; --line:#2b3342; --line2:#232a37; --line3:#3d4759;
  --tx:#e7eaf0; --tx2:#8f99ab; --acc:#4c8dff;
  --in:#3ecf8e; --out:#ff6b7d; --warn:#f5b544;
  --pink:#3a2a3d; --orange:#3d3120; --blue:#1f2a45; --green:#1d3630;
  --pinkD:#d8a7d4; --orangeD:#e3ad6a; --blueD:#93b3ff; --greenD:#79d1a4;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --inp:#141922; --soft:#212836; --foot:#1e2531; --chip:#262e3d; --hover:#232b39;
  --today:#33301c; --bar:#262e3d; --ghost:#2a3242; --scroll:#39435a;
  --soon:#3b3016; --late:#3d1f26;
}
html[data-theme="dark"] .mask{background:rgba(0,0,0,.62)}
html[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator,
html[data-theme="dark"] input[type=month]::-webkit-calendar-picker-indicator{filter:invert(.7)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer;box-shadow:var(--sh);transition:.12s}
button:hover{border-color:var(--line3);transform:translateY(-1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.gh{box-shadow:none;background:transparent;border-color:transparent;color:var(--tx2);padding:6px 9px}
button.gh:hover{background:var(--ghost);transform:none}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,111,237,.15)}
.num,td,th{font-variant-numeric:tabular-nums}

:root{--vh:100vh}
.app{height:var(--vh);display:flex;flex-direction:column;padding:16px 20px 18px;gap:14px}



/* ---------- шапка одной панелью ---------- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;flex:none;overflow:hidden;
     background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:9px 14px}
.top h1{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tx2);
        white-space:nowrap;flex:none;cursor:pointer}
.grp{display:flex;align-items:center;gap:8px;flex:none}
.top input,.top select,.top button{height:34px;border-radius:10px}
#month{width:138px;box-shadow:none;padding:0 8px;font-size:12.5px;background:var(--soft);border-color:transparent}
#month:hover{border-color:var(--line3)}
.rate{display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid transparent;border-radius:10px;
      padding:0 4px 0 10px;height:34px;font-size:12.5px}
.rate:hover{border-color:var(--line3)}
.rate{position:relative}
.rate #rateTxt{font-size:12px;white-space:nowrap;display:flex;gap:8px;align-items:center;cursor:default}
.ratepop{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:230px;z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 14px 40px rgba(10,20,40,.22)}
.rate:hover .ratepop{display:block}
.rp-t{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:6px}
.rp-r{display:flex;justify-content:space-between;gap:16px;padding:4px 0;border-top:1px solid var(--line2);font-size:12.5px}
.rp-r:first-of-type{border-top:none}
.rp-f{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line3);font-size:10.5px;color:var(--tx2)}
.rate button{padding:0 6px;height:26px;box-shadow:none;background:transparent;border:none;color:var(--tx2)}
#theme,#cloudBtn{flex:none;padding:0 11px;font-size:14px;line-height:1;box-shadow:none;background:var(--soft);border-color:transparent}
#cloudBtn.cloud-ok{color:var(--in)}
#cloudBtn.cloud-wait{color:var(--warn)}
#cloudBtn.cloud-err{color:var(--out)}
#cloudBtn.cloud-off{color:var(--tx2)}
#theme:hover{border-color:var(--line3)}
.sep{width:1px;height:30px;background:var(--line);flex:none}
.tot{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);flex:1 1 auto;min-width:0;overflow:hidden}
.tot>div{padding:0 10px;border-left:1px solid var(--line);text-align:center;min-width:0}
.tot>div:first-child{border-left:none}
.tot .l{font-size:9.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;margin-bottom:2px}
.tot .v{font-size:15px;font-weight:700;white-space:nowrap}
.acts{display:flex;gap:8px;flex:none;flex-wrap:nowrap;align-items:center}
.acts button{padding:0 13px;font-size:13px;box-shadow:none;background:var(--soft);border-color:transparent}
.acts button:hover{border-color:var(--line3);transform:none}
.acts button.pri{background:var(--acc);border-color:var(--acc)}
@media(max-width:1500px){.top h1{display:none}}
@media(max-width:1340px){.tot>div{padding:0 8px}}
@media(max-width:1180px){.tot>div:nth-child(3){display:none}}
@media(max-width:1040px){.tot{display:none}}


.grid{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr .6fr 1.1fr;gap:18px}
.col{display:flex;flex-direction:column;gap:18px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
      display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:1 1 0}
.card.hide{display:none}
.card>.h{display:flex;align-items:center;gap:6px;padding:14px 18px 10px;flex:none}
.card>.h b{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);cursor:text}
.card>.h b:hover{color:var(--acc)}
.card>.h .spacer{flex:1}
.card>.h button{padding:3px 9px;font-size:12px;box-shadow:none}
.card>.b{overflow:auto;padding:0 18px 14px;flex:1;min-height:0}
.card>.f{flex:none;padding:11px 18px;border-top:1px solid var(--line);background:var(--foot);
         display:flex;justify-content:space-between;align-items:center;font-weight:700}

table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;
   text-align:right;padding:0 8px 7px;position:sticky;top:0;background:var(--card);z-index:2}
th:first-child{text-align:left}
td{padding:6px 8px;text-align:right;border-top:1px solid var(--line2)}
td:first-child{text-align:left}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--hover)}
tr.today td{background:var(--today)}
.in{color:var(--in)}.out{color:var(--out)}.dim{color:var(--tx2)}
.hint{color:var(--tx2);font-size:11.5px}
.empty{color:var(--tx2);text-align:center;padding:20px 6px;font-size:12.5px}
.empty[data-empty],.empty[data-newgoal],.empty[data-addc]{cursor:pointer;border:1.5px dashed var(--line3);border-radius:12px;margin:6px 0;transition:.12s}
.empty[data-empty]:hover,.empty[data-newgoal]:hover,.empty[data-addc]:hover{border-color:var(--acc);color:var(--acc);background:rgba(47,111,237,.05)}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--chip);color:var(--tx2);margin:1px 3px 1px 0}
.pct{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--tx2)}
.okp{background:rgba(18,160,92,.14);color:var(--in)}
.badp{background:rgba(224,64,90,.14);color:var(--out)}

.secbox{border-radius:11px;padding:10px 13px;margin-bottom:12px}
.secbox .sh{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:4px;cursor:pointer}
.secbox td{border-color:rgba(128,140,160,.18);padding:5px 6px}
.s1{background:var(--pink)}.s1 .sh{color:var(--pinkD)}
.s2{background:var(--orange)}.s2 .sh{color:var(--orangeD)}
.s3{background:var(--blue)}.s3 .sh{color:var(--blueD)}
.s4{background:var(--green)}.s4 .sh{color:var(--greenD)}

.pay{display:flex;align-items:center;gap:11px;padding:7px 2px;border-top:1px solid var(--line2);cursor:pointer}
.pay:first-child{border-top:none}
.pay:hover{background:var(--hover)}
.pay .day{width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--tx2);
          display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.pay .nm{flex:1}
.pay .am{font-weight:600}
.pay .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line3);flex:none;
         display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.pay.done{opacity:.42}
.pay.done .ck{background:var(--in);border-color:var(--in);color:#fff}
.pay.soon .day{background:var(--soon);color:var(--warn)}
.pay.late .day{background:var(--late);color:var(--out)}

.mask{position:fixed;inset:0;background:rgba(18,25,40,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:16px;width:560px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;
       overflow:hidden;box-shadow:0 24px 70px rgba(10,20,40,.28)}
.modal.wide{width:920px}
.modal h3{font-size:16px;font-weight:700;padding:18px 22px 14px;display:flex;align-items:center}
.modal .mb{padding:2px 22px 18px;overflow:auto;font-size:14px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--foot)}
.x{cursor:pointer;color:var(--tx2);font-size:19px;line-height:1}
label{font-size:11.5px;color:var(--tx2);display:block;margin-bottom:5px;font-weight:500}
.f{margin-bottom:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:9px}
.chk input{width:17px;height:17px}
.chk label{margin:0;font-size:13px;color:var(--tx)}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;box-shadow:none}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .l{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:22px;font-weight:700;margin-top:5px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.crow{display:flex;gap:6px;margin-bottom:8px;align-items:center;border-radius:10px;transition:.1s}
.crow.over{box-shadow:0 -2px 0 var(--acc) inset,0 0 0 2px rgba(47,111,237,.15)}
.crow .grip{cursor:grab;color:var(--tx2);font-size:16px;padding:0 4px;user-select:none}
.crow .grip:active{cursor:grabbing}
.crow button{padding:5px 7px}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px}
.lg .d{width:11px;height:11px;border-radius:3px;flex:none}
.lg .n{flex:1}
.dashed{border:1.5px dashed var(--acc);background:transparent;color:var(--acc);font-weight:600;box-shadow:none;
        animation:pulse 1.8s ease-in-out infinite}
.dashed:hover{background:rgba(47,111,237,.08);border-color:var(--acc);animation:none}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.plist{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:14px}
.plist .pr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)}
.plist .pr:first-child{border-top:none}
.plist .pr .n{flex:1}
.chartbox{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 6px 2px;margin-bottom:8px}
.gstrip{display:flex;align-items:center;gap:16px;flex:none;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--sh);padding:10px 16px;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.gstrip:hover{border-color:var(--acc)}
.gs-l{position:absolute;left:0;top:0;bottom:0;width:4px}
.gs-n{font-weight:700;font-size:13.5px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.gs-star{color:#f0a02c;margin-right:6px}
.gs-b{flex:1;min-width:120px}
.gs-b .pbig{height:24px}
.gs-b .pbig>span{font-size:11.5px}
.gs-i{text-align:right;white-space:nowrap}
.gs-i .l{font-size:9.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.gs-i .v{font-size:13.5px;font-weight:700}
.gs-go{padding:6px 12px;font-size:12.5px;box-shadow:none;background:var(--soft);border-color:transparent;white-space:nowrap}
.star{cursor:pointer;font-size:17px;line-height:1;color:var(--tx2);transition:.12s}
.star:hover{color:#f0a02c;transform:scale(1.15)}
.star.on{color:#f0a02c}
@media(max-width:1200px){.gs-i:nth-of-type(3){display:none}}
.grip2{cursor:grab;color:var(--tx2);opacity:.5;font-size:14px;margin-right:2px;user-select:none;touch-action:none}
.grip2:active{cursor:grabbing}
.card.dragging{opacity:.45;transform:scale(.99);outline:2px dashed var(--acc)}
.col.dropzone{outline:2px dashed var(--acc);outline-offset:4px;border-radius:16px}
.pnote{display:flex;gap:10px;align-items:center;padding:7px 2px;border-top:1px solid var(--line2);
  cursor:pointer;font-size:12.5px}
.pnote:hover{background:var(--hover)}
.pn-t{flex:1;color:var(--tx)}
.pn-d{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--tx2);white-space:nowrap}
.pn-d.out{background:var(--late);color:var(--out)}
.pn-d.in{background:rgba(18,160,92,.14);color:var(--in)}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgc{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.imgc img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.imgx{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);
  color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.imgx:hover{background:var(--out)}
.bdg{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;
  border-radius:20px;background:var(--chip);color:var(--tx2);margin-left:7px;vertical-align:middle}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.pgrip{cursor:grab;color:var(--tx2);opacity:0;font-size:13px;user-select:none;transition:.12s;padding:0 2px;touch-action:none}
.pay:hover .pgrip{opacity:.55}
.pgrip:active{cursor:grabbing}
.dragghost{position:fixed;z-index:90;pointer-events:none;background:var(--card);border:1.5px solid var(--acc);
  border-radius:10px;box-shadow:0 14px 34px rgba(10,20,40,.35);display:flex;align-items:center;
  padding:0 12px;font-size:12.5px;font-weight:600;overflow:hidden;white-space:nowrap;opacity:.96}
.rowmark{opacity:.35}
.rowmark td,.rowmark .nm{background:rgba(47,111,237,.10)}
.agrip{cursor:grab;color:var(--tx2);opacity:0;margin-right:7px;font-size:13px;user-select:none;transition:.12s;touch-action:none}
tr:hover .agrip{opacity:.55}
.agrip:active{cursor:grabbing}
tr.rowdrag td{opacity:.4;background:var(--hover)}
.pgoal{display:flex;align-items:center;gap:9px;border:1.5px solid var(--acc);border-radius:11px;
  padding:8px 11px;margin:2px 0 10px;cursor:pointer;background:var(--soft);transition:.12s}
.pgoal:hover{filter:brightness(.98);transform:translateY(-1px)}
.pg-d{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.pg-n{font-weight:700;font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-p{font-size:12px;font-weight:700}
.plab{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx2);
  padding:6px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.pod{margin-top:8px;font-size:11.5px;color:var(--warn);background:var(--soon);border-radius:8px;
  padding:6px 9px;cursor:pointer}
.pod:hover{filter:brightness(.97)}
.ck2.sm{width:18px;height:18px;border-radius:6px;font-size:10px}
.cardph{border:2px dashed var(--acc);border-radius:14px;background:rgba(47,111,237,.06)}
.card.dragfly{position:fixed;z-index:80;pointer-events:none;box-shadow:0 24px 60px rgba(10,20,40,.35);
  transform:rotate(.4deg);opacity:.97}
.goalcard{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.12s}
.goalcard:hover{border-color:var(--acc);transform:translateY(-1px)}
.calbody{height:58vh;padding-right:2px}
.calbody.scr{overflow:auto}
.calbody.fix{overflow:hidden;display:flex;flex-direction:column}
.calbody.fix .cgrid{flex:1;min-height:0;grid-auto-rows:1fr}
.calbody.fix .cgrid.head{flex:none}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cgrid.head{margin-bottom:6px;gap:6px}
.cwd{font-size:10.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:2px 0}
.cday{min-height:0;height:100%;border:1px solid var(--line);border-radius:10px;padding:4px 5px;background:var(--soft);
      cursor:pointer;transition:.12s;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.cday .cmore{font-size:10px;color:var(--tx2);padding-left:3px}
.cday:hover{border-color:var(--acc)}
.cday.empty2{background:transparent;border-color:transparent;cursor:default}
.cday.now{border-color:var(--acc);box-shadow:0 0 0 2px rgba(47,111,237,.15)}
.cday .cd{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:3px}
.cday .cs{font-size:10.5px;font-weight:600}
.ctask{font-size:10.5px;background:rgba(47,111,237,.12);color:var(--acc);border-radius:5px;
       padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctask.done{background:rgba(18,160,92,.14);color:var(--in);text-decoration:line-through}
.cpay{font-size:10.5px;background:var(--chip);color:var(--tx2);border-radius:5px;padding:2px 5px;margin-top:3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cpay:hover{outline:1px solid var(--acc)}
.cpay.pdone{background:rgba(18,160,92,.14);color:var(--in);text-decoration:line-through}
.cdot{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.12s}
.cdot:hover{transform:scale(1.08)}
.cdot.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--card) inset}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ymon{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}
.ymt{font-weight:700;font-size:13px;margin-bottom:6px;cursor:pointer;color:var(--acc)}
.ydays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;text-align:center}
.ydays u{color:var(--tx2);text-decoration:none;font-size:9.5px}
.ydays i,.ydays b{display:block;padding:2px 0;border-radius:5px;font-weight:400;cursor:pointer}

<script>
/* ================= ДАННЫЕ ================= */
const DEMO=false;
const KEY='pf_app';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=new Date();
const p2=n=>String(n).padStart(2,'0');
const ym=d=>{const t=new Date(d);return t.getFullYear()+'-'+p2(t.getMonth()+1);};
const iso=d=>{const t=new Date(d);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());};
const TZNAME=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){return '';}})();
const TZOFF=(()=>{const m=-new Date().getTimezoneOffset();
  return (m>=0?'+':'−')+p2(Math.floor(Math.abs(m)/60))+(Math.abs(m)%60?':'+p2(Math.abs(m)%60):'');})();
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MODS={days:'Доходы / расходы',flow:'Кэшфлоу · источники дохода',bal:'Общий баланс',
            biz:'Месячные платежи бизнес',per:'Месячные платежи личные',
            debt:'Долги',plan:'Планер'};
const defMods=()=>Object.fromEntries(Object.entries(MODS).map(([k,v])=>[k,{title:v,hidden:false}]));
const EXP=['Продукты','Кафе и рестораны','Алкоголь','Транспорт','Такси','Жильё','Дети','Жена','Связь',
  'Подписки и сервисы','Здоровье','Красота','Одежда','Спорт','Развлечения','Подарки','Ремонт','Питомцы',
  'Образование','Юридические','Возврат долга','Выдал в долг','Комиссии','Прочее'];
const INC=['Трейдинг','Зарплата','Инвестиции','Возврат долга','Подарок','Прочее'];

function seed(){
  const base={settings:{rate:79,lastAcc:'',lastCat:'',theme:'light',chart:'line'},modules:defMods(),tx:[],goals:[]};
  if(!DEMO)return {...base,
    sections:[1,2,3,4].map(i=>({id:'s'+i,name:'Секция '+i,cls:'s'+i})),
    accounts:[],sources:[],debts:[],payments:[],catsExp:[...EXP],catsInc:[...INC]};
  const sections=[{id:'s1',name:'Трейдинг',cls:'s1'},{id:'s2',name:'Личное',cls:'s2'},
                  {id:'s3',name:'Прочее',cls:'s3'},{id:'s4',name:'Фонды',cls:'s4'}];
  const accounts=[
    ['Hyrotrader проп счёт','s1','USD',9851,0],['Hyrotrader','s1','USD',0,0],
    ['Bybit един.торговый','s1','USD',4250,0],['Bybit суб.акаунт','s1','USD',1000,0],
    ['Sofia trust wallet','s2','USD',3,0],['Sofia','s2','USD',3,0],['Alina','s2','USD',0,0],
    ['Zarub','s3','USD',19,1],['Алтын','s3','RUB',4,1],['Озон','s3','RUB',4000,1],['Кошелек','s3','RUB',0,0],
    ['Фонд «Основной»','s4','RUB',0,0],['Фонд «На квартиру»','s4','RUB',0,0],['Фонд «Устины»','s4','RUB',0,0]
  ].map(a=>({id:uid(),name:a[0],sectionId:a[1],cur:a[2],opening:a[3],fav:!!a[4]}));
  const sources=['Hyrotrader','Bybit един.торговый','Bybit суб.акаунт','Sofia','Alina','Инвестиции']
    .map((n,i)=>({id:uid(),name:n,plan:i===5?6000:1000}));
  const debts=[['Игорь Угаров',456000],['Саша Бирюков',250000],['Банкротсво Я',90000],
    ['Банкротсво И',60000],['Жена',38000]].map(d=>({id:uid(),name:d[0],amount:d[1]}));
  const payments=[
    ['GPT','biz',23,20,'USD'],['KIE (kling, seedream, wan)','biz',5,50,'USD'],['Claude','biz',16,20,'USD'],
    ['Я плюс','per',3,449,'RUB'],['Интернет','per',4,900,'RUB'],['Детский сад','per',5,3150,'RUB'],
    ['Банкротсво','per',5,10000,'RUB'],['Моб жены','per',6,800,'RUB'],['Угар','per',9,11098,'RUB'],
    ['Моб рабочий','per',21,400,'RUB'],['Аренда жилья','per',22,46000,'RUB'],['Моб мой','per',29,1000,'RUB'],
    ['Жене на ногти','goal',17,4000,'RUB'],['Бары с женой','goal',18,15000,'RUB'],
    ['Долг Игорю','goal',24,60000,'RUB'],['Приверти. Устину','goal',30,10000,'RUB']
  ].map(p=>({id:uid(),name:p[0],kind:p[1],day:p[2],amount:p[3],cur:p[4],done:{}}));
  return {...base,sections,accounts,sources,debts,payments,catsExp:[...EXP],catsInc:[...INC]};
}
let S=JSON.parse(localStorage.getItem(KEY)||'null')||seed();
if(!S.modules)S.modules=defMods();
Object.keys(MODS).forEach(k=>{if(!S.modules[k])S.modules[k]={title:MODS[k],hidden:false};});
Object.keys(S.modules).forEach(k=>{if(!MODS[k])delete S.modules[k];});
S.payments=(S.payments||[]).filter(p=>p.kind!=='goal');
if(S.layout)Object.keys(S.layout).forEach(c=>S.layout[c]=(S.layout[c]||[]).filter(k=>MODS[k]));
S.payments.forEach(p=>{if(!p.done)p.done={};});
if(!S.settings.theme)S.settings.theme='light';
if(!S.goals)S.goals=[];
if(!S.plan)S.plan=[];
/* --- разовая миграция: фиксируем курс операций и убираем кросс-валютные записи --- */
if(!S.settings.fxFixed){
  const A={};(S.accounts||[]).forEach(a=>A[a.id]=a);
  const R0=+S.settings.rate||79;
  (S.tx||[]).forEach(t=>{
    const from=A[t.accountId], to=A[t.toAccountId];
    if(from && t.cur!==from.cur){                       /* операция была не в валюте счёта */
      t.amount = from.cur==='RUB' ? +(t.amount*R0).toFixed(2) : +(t.amount/R0).toFixed(2);
      t.cur = from.cur;
    }
    t.rate = t.cur==='RUB' ? 1 : R0;
    if(t.type==='tr' && from && to && from.cur!==to.cur && t.amount2==null){
      t.amount2 = to.cur==='RUB' ? +(t.amount*R0).toFixed(2) : +(t.amount/R0).toFixed(2);
      t.cur2 = to.cur; t.rate2 = to.cur==='RUB'?1:R0;
    }
  });
  S.settings.fxFixed=1;
}
if(!S.settings.curs)S.settings.curs=['RUB','USD'];
if(!S.rates)S.rates={USD:S.settings.rate||79};
let MONTH=localStorage.getItem(KEY+'_m')||ym(today);
let PERIOD='m', ANALKIND='out', CHART=(S.settings.chart||'line');
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'_m',MONTH);
  if(typeof cloudPush==='function'&&SB)cloudPush();};

/* ================= РАСЧЁТЫ ================= */
const $=id=>document.getElementById(id);
const f=n=>Math.round(n).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/"/g,'&quot;');
const acc=id=>S.accounts.find(a=>a.id===id);
const toRub=(v,cur)=>v*rate(cur||'RUB');
const toUsd=(v,cur)=>toRub(v,cur)/rate('USD');
/* курс операции фиксируется при вводе: рублёвые операции никогда не пересчитываются */
const txRate=t=>t.cur==='RUB'?1:(+t.rate||rate(t.cur));
const txRub=t=>t.amount*txRate(t);
const txIn=t=>(t.type==='tr'&&t.amount2!=null)?t.amount2:t.amount;      /* сколько зачислено */
const txInCur=t=>(t.type==='tr'&&t.cur2)?t.cur2:t.cur;
const txInRub=t=>txIn(t)*(txInCur(t)==='RUB'?1:(+t.rate2||rate(txInCur(t))));
const monthTx=()=>S.tx.filter(t=>t.date.slice(0,7)===MONTH);
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const isCur=()=>MONTH===ym(today);
const defAcc=()=>{const l=acc(S.settings.lastAcc);if(l&&!l.off)return l;
  return S.accounts.find(a=>a.fav&&!a.off)||S.accounts.find(a=>!a.off)||S.accounts[0]||null;};
function balanceOf(a){
  let b=a.opening;
  for(const t of S.tx){
    if(t.type==='in' && t.accountId===a.id) b+=t.amount;
    if(t.type==='out'&& t.accountId===a.id) b-=t.amount;
    if(t.type==='tr'){
      if(t.accountId===a.id)   b-=t.amount;           /* списано в валюте счёта-источника */
      if(t.toAccountId===a.id) b+=txIn(t);            /* зачислено в валюте счёта-получателя */
    }
  }
  return b;
}
const assets=()=>S.accounts.reduce((s,a)=>s+toRub(balanceOf(a),a.cur),0);
const debtSum=()=>S.debts.reduce((s,d)=>s+d.amount,0);
const mInc=()=>monthTx().filter(x=>x.type==='in').reduce((s,x)=>s+txRub(x),0);
const mOut=()=>monthTx().filter(x=>x.type==='out').reduce((s,x)=>s+txRub(x),0);
const isDoneM=(p,mk)=>!!(p.done&&p.done[mk]);
const isDone=p=>isDoneM(p,MONTH);
function periodTx(){
  if(PERIOD==='m')return monthTx();
  if(PERIOD==='all')return S.tx;
  if(PERIOD==='w'){
    const e=isCur()?new Date(today):new Date(+MONTH.slice(0,4),+MONTH.slice(5,7),0);
    const s=new Date(e);s.setDate(s.getDate()-6);
    const a=iso(s),b=iso(e);return S.tx.filter(t=>t.date>=a&&t.date<=b);}
  const end=new Date(+MONTH.slice(0,4),+MONTH.slice(5,7),0);
  const st=new Date(end);st.setDate(1);st.setMonth(st.getMonth()-(PERIOD==='3'?2:11));
  const a=iso(st),b=iso(end);
  return S.tx.filter(t=>t.date>=a&&t.date<=b);
}
const periodName=()=>PERIOD==='w'?'За неделю':PERIOD==='m'?'За месяц':PERIOD==='3'?'За 3 месяца':PERIOD==='y'?'За 12 месяцев':'За всё время';
const GCOL=['#2f6fed','#12a05c','#e0405a','#f0a02c','#9c5397','#37b6c4','#7b61ff','#e5744b'];
const PAL=['#2f6fed','#e0405a','#f0a02c','#9c5397','#37b6c4','#7b61ff','#e5744b','#c94f7c',
           '#5a7bd8','#b8860b','#20a4a4','#d2691e','#6a5acd','#8fbc4a','#12a05c','#a0522d'];
const CURS={RUB:'₽',USD:'$',EUR:'€',CNY:'¥',GBP:'£',USDT:'₮',BTC:'₿'};
const CURN={RUB:'Рубль',USD:'Доллар',EUR:'Евро',CNY:'Юань',GBP:'Фунт',USDT:'USDT',BTC:'Биткоин'};
const curList=()=>(S.settings.curs&&S.settings.curs.length?S.settings.curs:['RUB','USD']);
const rate=c=>c==='RUB'?1:(+(S.rates&&S.rates[c])||(c==='USD'||c==='USDT'?S.settings.rate:0)||1);
const csym=c=>CURS[c]||c;
const hexa=(h,a)=>{h=(h||'#2f6fed').replace('#','');
  const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
const PAL_IN=['#12a05c','#2f6fed','#37b6c4','#7b61ff','#4a9d5b','#0f9d9d','#5a7bd8','#8fbc4a'];
const pal=kind=>kind==='in'?PAL_IN:PAL;

/* ================= ОКНА ================= */
let MLOCK=false, MDIRTY=false, M2DIRTY=false;
function watchDirty(el,set){el.addEventListener('input',set);el.addEventListener('change',set);}
function openModal(title,html,footer,wide,lock){
  MLOCK=!!lock;MDIRTY=false;
  $('modalBox').classList.toggle('wide',!!wide);
  document.querySelector('#modalBox .x').style.display='';
  $('mTitle').textContent=title;$('mBody').innerHTML=html;$('mFoot').innerHTML='';
  (footer||[]).forEach(b=>{const el=document.createElement('button');el.textContent=b.t;if(b.p)el.className='pri';
    if(b.d)el.style.marginRight='auto';el.onclick=b.f;if(b.id)el.id=b.id;$('mFoot').appendChild(el);});
  $('mask').classList.add('on');bgLock();
  watchDirty($('mBody'),()=>MDIRTY=true);
}
function bgLock(){document.documentElement.classList.toggle('mopen',
  $('mask').classList.contains('on')||$('mask2').classList.contains('on'));}
function closeModal(){MLOCK=false;$('mask').classList.remove('on');bgLock();}
function tryClose(){
  if(MLOCK&&MDIRTY)return dlg('Закрыть окно?','<p style="padding:4px 0 8px">Введённые данные не сохранены. Закрыть без сохранения?</p>',
    [{t:'Остаться',f:closeDlg},{t:'Закрыть',p:1,f:()=>{closeDlg();closeModal();}}]);
  closeModal();}
$('mask').onclick=e=>{if(e.target===$('mask')&&!MLOCK)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){
  if($('mask2').classList.contains('on'))closeDlg();else if(!MLOCK)closeModal();}});
function closeDlg(){$('mask2').classList.remove('on');bgLock();$('modalBox2').style.width='430px';
  document.querySelector('#modalBox2 .x2').style.display='none';}
/* полноценное окно поверх текущего */
let M2CLOSE=null;
function openModal2(title,html,footer,w){
  $('modalBox2').style.width=(w||520)+'px';
  const x=document.querySelector('#modalBox2 .x2');x.style.display='';
  $('dTitle').textContent=title;$('dBody').innerHTML=html;$('dFoot').innerHTML='';
  (footer||[]).forEach(b=>{const el=document.createElement('button');el.textContent=b.t;if(b.p)el.className='pri';
    if(b.d)el.style.marginRight='auto';el.onclick=b.f;if(b.id)el.id=b.id;$('dFoot').appendChild(el);});
  $('mask2').classList.add('on');M2DIRTY=false;bgLock();
  watchDirty($('dBody'),()=>M2DIRTY=true);

}
function tryClose2(){if(!M2DIRTY){closeDlg();if(M2CLOSE)M2CLOSE();return;}dlg2Guard();}
function dlg2Guard(){
  dlg('Закрыть окно?','<p style="padding:4px 0 8px">Введённые данные не сохранены. Закрыть без сохранения?</p>',
    [{t:'Остаться',f:closeDlg},{t:'Закрыть',p:1,f:()=>{closeDlg();if(M2CLOSE)M2CLOSE();}}]);
}
function dlg(title,body,buttons){
  $('modalBox2').style.width='430px';document.querySelector('#modalBox2 .x2').style.display='none';
  $('dTitle').textContent=title;$('dBody').innerHTML=body;$('dFoot').innerHTML='';
  buttons.forEach(b=>{const el=document.createElement('button');el.textContent=b.t;if(b.p)el.className='pri';
    el.onclick=b.f;$('dFoot').appendChild(el);});
  $('mask2').classList.add('on');
  const i=$('dBody').querySelector('input');if(i)setTimeout(()=>{i.focus();i.select();},50);
}
$('mask2').onclick=e=>{if(e.target===$('mask2'))closeDlg();};
function uiAlert(msg,cb){dlg('Внимание',`<p style="padding:4px 0 8px">${msg}</p>`,
  [{t:'Понятно',p:1,f:()=>{closeDlg();cb&&cb();}}]);}
function uiConfirm(msg,cb){dlg('Подтвердите',`<p style="padding:4px 0 8px">${msg}</p>`,
  [{t:'Отмена',f:closeDlg},{t:'Да, удалить',p:1,f:()=>{closeDlg();cb();}}]);}
function uiPrompt(title,label,value,cb){
  dlg(title,`<div class="f"><label>${label}</label><input id="dInp" value="${esc(value)}"></div>`,
    [{t:'Отмена',f:closeDlg},{t:'Сохранить',p:1,f:()=>{const v=$('dInp').value.trim();if(!v)return;closeDlg();cb(v);}}]);
  $('dInp').onkeydown=e=>{if(e.key==='Enter'){const v=$('dInp').value.trim();if(v){closeDlg();cb(v);}}};
}
function optAcc(sel){
  const o=a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.name} · ${a.cur}</option>`;
  const vis=S.accounts.filter(a=>!a.off||a.id===sel);
  const fav=vis.filter(a=>a.fav),rest=vis.filter(a=>!a.fav);
  if(!vis.length)return '<option value="">— сначала добавьте счёт —</option>';
  return (fav.length?`<optgroup label="Основные (для трат)">${fav.map(o).join('')}</optgroup>`:'')+
         (rest.length?`<optgroup label="${fav.length?'Остальные счета':'Счета'}">${rest.map(o).join('')}</optgroup>`:'');
}
const optList=(arr,sel)=>arr.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
const optSrc=sel=>'<option value="">— не указан —</option>'+S.sources.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${s.name}</option>`).join('');

/* ---------- ввод операций за день (пакетный) ---------- */
function entryModal(ds,preType){
  if(!S.accounts.length)return uiAlert('Сначала добавьте счёт в модуле «Общий баланс».');
  const da=defAcc();
  let type=preType||'out', pend=[];
  const html=`
   <div class="seg" id="seg">
     <button data-v="in" class="${type==='in'?'on':''}">Доход</button>
     <button data-v="out" class="${type==='out'?'on':''}">Расход</button>
     <button data-v="tr" class="${type==='tr'?'on':''}">Перевод</button></div>
   <div class="f2"><div class="f"><label>Дата</label><input type="date" id="d" value="${ds}"></div>
     <div class="f"><label>Сумма <span class="hint" id="curHint"></span></label><div style="display:flex;gap:8px">
       <input type="number" step="0.01" id="a" placeholder="0">
       <input id="c" value="RUB" readonly style="width:92px;text-align:center;background:var(--soft);cursor:default"></div></div></div>
   <div class="f" id="wSrc" style="display:none"><label>Источник дохода (для кэшфлоу)</label><select id="src">${optSrc('')}</select></div>
   <div class="f" id="wCat"><label>Категория <span class="pct" id="catSet" style="cursor:pointer;float:right">настроить</span></label>
     <select id="cat"></select></div>
   <div class="f"><label><span id="lbA">Счёт списания</span><span class="pct" id="accSet" style="cursor:pointer;float:right">настроить список</span></label>
     <select id="ac">${optAcc(da.id)}</select></div>
   <div class="f" id="wTo" style="display:none"><label>Счёт зачисления</label><select id="ac2">${optAcc(S.accounts[1]?.id)}</select>
     <div id="wConv" style="display:none;margin-top:10px">
       <label>Сколько реально зачислено <span class="hint" id="conv2"></span></label>
       <div style="display:flex;gap:8px"><input type="number" step="0.01" id="a2" placeholder="0">
         <input id="c2" value="" readonly style="width:92px;text-align:center;background:var(--soft);cursor:default"></div>
       <p class="hint" style="margin-top:6px">Валюты счетов разные — впишите сумму из выписки, курс зафиксируется по этой операции.</p></div></div>
   <div class="f"><label>Комментарий</label><input id="n" placeholder="необязательно"></div>
   <button id="more" class="dashed" style="width:100%;margin-bottom:16px">＋ Добавить ещё одну строку</button>
   <div id="pend"></div>
   <div id="exist"></div>`;
  const rerenderPend=()=>{
    if(!pend.length){$('pend').innerHTML='';return;}
    const sum=pend.reduce((s,r)=>s+(r.type==='out'?-toRub(r.amount,r.cur):r.type==='in'?toRub(r.amount,r.cur):0),0);
    $('pend').innerHTML=`<label>Будет записано (${pend.length})</label><div class="plist">`+
      pend.map((r,i)=>`<div class="pr"><span class="n">${r.type==='tr'?'Перевод':r.category}
        ${r.note?'<span class="hint">· '+r.note+'</span>':''}</span>
        <b class="${r.type==='in'?'in':r.type==='out'?'out':'dim'}">${r.type==='out'?'−':r.type==='in'?'+':''}${f(toRub(r.amount,r.cur))} ₽</b>
        <button class="gh" data-rm="${i}">✕</button></div>`).join('')+
      `</div><div class="hint" style="text-align:right;margin:-8px 0 14px">итого ${sum>=0?'+':'−'}${f(Math.abs(sum))} ₽</div>`;
  };
  const rerenderExist=()=>{
    const list=S.tx.filter(x=>x.date===$('d').value);
    $('exist').innerHTML=list.length?`<label>Уже записано в этот день (${list.length}) — клик, чтобы изменить</label>
      <div class="plist">`+list.map(x=>`<div class="pr" data-tx="${x.id}" style="cursor:pointer">
        <span class="n">${x.type==='tr'?'Перевод':x.category}${x.note?'<span class="hint"> · '+x.note+'</span>':''}</span>
        <b class="${x.type==='in'?'in':x.type==='out'?'out':'dim'}">${x.type==='out'?'−':x.type==='in'?'+':''}${f(txRub(x))} ₽</b>
        </div>`).join('')+'</div>':'';
  };
  const collect=()=>{
    const amount=+$('a').value;
    if(!amount)return null;
    const from=acc($('ac').value), to=type==='tr'?acc($('ac2').value):null;
    const o={id:uid(),date:$('d').value,type,amount,cur:from?from.cur:'RUB',rate:from&&from.cur!=='RUB'?rate(from.cur):1,
      accountId:$('ac').value,toAccountId:type==='tr'?$('ac2').value:null,
      category:type==='tr'?'Перевод':$('cat').value,
      sourceId:type==='in'?$('src').value:'',note:$('n').value};
    if(type==='tr'){
      if(o.accountId===o.toAccountId){uiAlert('Счёт списания и зачисления совпадают');return undefined;}
      if(to&&from&&to.cur!==from.cur){
        const a2=+$('a2').value;
        if(!a2){uiAlert('Укажите, сколько реально зачислено на «'+to.name+'» в '+csym(to.cur));return undefined;}
        o.amount2=a2;o.cur2=to.cur;o.rate2=to.cur!=='RUB'?rate(to.cur):1;
      }
    }
    return o;
  };
  const addRow=()=>{const o=collect();
    if(o===undefined)return false;
    if(!o){uiAlert('Введите сумму');return false;}
    pend.push(o);S.settings.lastAcc=o.accountId;if(type==='out')S.settings.lastCat=o.category;
    rerenderPend();$('a').value='';$('n').value='';if($('a2'))$('a2').value='';$('a').focus();return true;};
  const commit=()=>{
    if(+$('a').value){if(!addRow())return;}
    if(!pend.length)return closeModal();
    pend.forEach(o=>S.tx.push(o));save();render();closeModal();};

  const d=new Date(ds);
  openModal(d.getDate()+' '+MN[d.getMonth()],html,
    [{t:'Отмена',f:closeModal},{t:'Сохранить',p:1,id:'saveBtn',f:commit}]);
  let sync=()=>{
    $('wTo').style.display=type==='tr'?'':'none';
    $('wCat').style.display=type==='tr'?'none':'';
    $('wSrc').style.display=type==='in'?'':'none';
    $('lbA').textContent=type==='in'?'Счёт зачисления':'Счёт списания';
    const keep=$('cat').value;
    $('cat').innerHTML=optList(type==='in'?S.catsInc:S.catsExp,keep||S.settings.lastCat);
  };sync();rerenderExist();
  $('seg').onclick=e=>{const v=e.target.dataset.v;if(!v)return;type=v;
    [...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));sync();};
  const syncCur=()=>{
    const from=acc($('ac').value), to=acc($('ac2')?$('ac2').value:null);
    if(from){$('c').value=from.cur;$('curHint').textContent='в валюте счёта · '+csym(from.cur);}
    const diff = type==='tr' && from && to && from.cur!==to.cur;
    $('wConv').style.display=diff?'':'none';
    if(diff){$('c2').value=to.cur;
      $('conv2').textContent='ориентир по курсу: '+f(from.cur==='RUB'?(+$('a').value||0)/rate(to.cur):(+$('a').value||0)*rate(from.cur)/rate(to.cur))+' '+csym(to.cur);}
  };
  syncCur();
  $('ac').addEventListener('change',syncCur);
  if($('ac2'))$('ac2').addEventListener('change',syncCur);
  $('a').addEventListener('input',syncCur);
  const _sync0=sync; sync=()=>{_sync0();syncCur();};
  $('more').onclick=addRow;
  $('a').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addRow();}};
  $('n').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addRow();}};
  $('d').onchange=rerenderExist;
  $('pend').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;
    pend.splice(+b.dataset.rm,1);rerenderPend();};
  $('exist').onclick=e=>{const b=e.target.closest('[data-tx]');if(!b)return;
    txModal(S.tx.find(x=>x.id===b.dataset.tx),()=>entryModal($('d').value,type));};
  $('accSet').onclick=()=>accPickerModal(()=>entryModal(ds,type));
  $('catSet').onclick=()=>catsModal(type==='in'?'in':'out',()=>entryModal(ds,type));
  setTimeout(()=>$('a').focus(),60);
}

/* ---------- правка одной операции ---------- */
function txModal(t,back){
  let type=t.type;
  const html=`
   <div class="seg" id="seg">
     <button data-v="in" class="${type==='in'?'on':''}">Доход</button>
     <button data-v="out" class="${type==='out'?'on':''}">Расход</button>
     <button data-v="tr" class="${type==='tr'?'on':''}">Перевод</button></div>
   <div class="f2"><div class="f"><label>Дата</label><input type="date" id="d" value="${t.date}"></div>
     <div class="f"><label>Сумма</label><div style="display:flex;gap:8px">
       <input type="number" step="0.01" id="a" value="${t.amount}">
       <input id="c" value="${t.cur}" readonly style="width:92px;text-align:center;background:var(--soft);cursor:default"></div></div></div>
   <div class="f" id="wSrc" style="display:none"><label>Источник дохода</label><select id="src">${optSrc(t.sourceId)}</select></div>
   <div class="f" id="wCat"><label>Категория</label><select id="cat"></select></div>
   <div class="f"><label id="lbA">Счёт списания</label><select id="ac">${optAcc(t.accountId)}</select></div>
   <div class="f" id="wTo" style="display:none"><label>Счёт зачисления</label><select id="ac2">${optAcc(t.toAccountId||S.accounts[1]?.id)}</select></div>
   <div class="f"><label>Комментарий</label><input id="n" value="${esc(t.note)}"></div>`;
  openModal('Операция',html,[
    {t:'Удалить',d:1,f:()=>uiConfirm('Удалить операцию?',()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save();render();back?back():closeModal();})},
    {t:'Отмена',f:()=>back?back():closeModal()},
    {t:'Сохранить',p:1,f:()=>{
      const amount=+$('a').value;if(!amount)return uiAlert('Введите сумму');
      if(type==='tr'&&$('ac').value===$('ac2').value)return uiAlert('Счёт списания и зачисления совпадают');
      const fr=acc($('ac').value);
      Object.assign(t,{type,date:$('d').value,amount,cur:fr?fr.cur:t.cur,
        rate:(fr&&fr.cur!=='RUB')?(t.rate||rate(fr.cur)):1,accountId:$('ac').value,
        toAccountId:type==='tr'?$('ac2').value:null,
        category:type==='tr'?'Перевод':$('cat').value,
        sourceId:type==='in'?$('src').value:'',note:$('n').value});
      save();render();back?back():closeModal();}}]);
  const sync=()=>{
    $('wTo').style.display=type==='tr'?'':'none';
    $('wCat').style.display=type==='tr'?'none':'';
    $('wSrc').style.display=type==='in'?'':'none';
    $('lbA').textContent=type==='in'?'Счёт зачисления':'Счёт списания';
    const keep=$('cat').value;
    $('cat').innerHTML=optList(type==='in'?S.catsInc:S.catsExp,keep||t.category);
  };sync();
  $('seg').onclick=e=>{const v=e.target.dataset.v;if(!v)return;type=v;
    [...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));sync();};
}

/* ---------- справочники ---------- */
function accPickerModal(back){
  const html=`<p class="hint" style="margin-bottom:12px">Отметьте счета, которые участвуют в списаниях и зачислениях.
    Снятые галочки пропадут из выпадающего списка. ★ — счета, которые подставляются первыми.</p>`+
    (S.accounts.map(a=>`<div class="chk" style="margin-bottom:9px">
      <input type="checkbox" id="p_${a.id}" ${a.off?'':'checked'}>
      <label for="p_${a.id}" style="flex:1">${a.name} <span class="hint">· ${a.cur}</span></label>
      <span class="pct" data-favt="${a.id}" style="cursor:pointer;${a.fav?'background:var(--soon);color:var(--warn)':''}">${a.fav?'★ основной':'☆ сделать основным'}</span>
    </div>`).join('')||'<div class="empty">Счетов пока нет</div>');
  openModal('Счета для списания',html,[{t:'Готово',p:1,f:()=>{
    S.accounts.forEach(a=>{const el=$('p_'+a.id);if(el)a.off=!el.checked;});
    save();render();back?back():closeModal();}}]);
  $('mBody').onclick=e=>{const t=e.target.closest('[data-favt]');if(!t)return;
    const a=acc(t.dataset.favt);a.fav=!a.fav;save();accPickerModal(back);};
}
function catsModal(kind,back){

      <button data-k="in" class="${kind==='in'?'on':''}">Категории доходов</button>

    <div id="clist">${arr.map((c,i)=>`<div class="crow" draggable="true" data-row="${i}">
      <span class="grip">⠿</span><input value="${esc(c)}" data-i="${i}">
      <button class="gh" data-up="${i}" ${i===0?'disabled style="opacity:.25"':''}>↑</button>
      <button class="gh" data-down="${i}" ${i===arr.length-1?'disabled style="opacity:.25"':''}>↓</button>
      <button class="gh" data-del="${i}">✕</button></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px">

function simpleModal(title,fields,obj,onSave,onDel){

    const inp=fl.t==='select'?`<select id="${fl.k}">${optList(fl.o,obj[fl.k])}</select>`
      :fl.t==='kv'?`<select id="${fl.k}">${fl.o.map(o=>`<option value="${o[0]}" ${o[0]===obj[fl.k]?'selected':''}>${o[1]}</option>`).join('')}</select>`

    return `<div class="f"><label>${fl.l}</label>${inp}</div>`;}).join('');

  foot.push({t:'Отмена',f:closeModal},{t:'Сохранить',p:1,f:()=>{

const short=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?0:1).replace('.',',')+' млн'
  :v>=1e3?Math.round(v/1e3)+' тыс':String(Math.round(v));
let CHID=0;
function lineChart(items,h,series){
  h=h||260;
  series=series||[{k:'i',c:'#12a05c'},{k:'o',c:'#e0405a'}];
  const W=880, AX=74, PAD=18, base=h-28, top=16, id='g'+(++CHID);
  const mx=Math.max(1,...items.flatMap(x=>series.map(s=>x[s.k]||0)));
  const n=items.length;
  const X=i=>n<2?AX+(W-AX-PAD)/2:AX+(W-AX-PAD)*(i/(n-1));
  const Y=v=>base-(base-top)*(v/mx);
  const ticks=[0,.25,.5,.75,1].map(k=>{const y=base-(base-top)*k;
    return `<line x1="${AX}" y1="${y}" x2="${W-4}" y2="${y}" stroke="currentColor"
        opacity="${k?.07:.2}" ${k?'':'stroke-dasharray="4 4"'}></line>
      <text x="${AX-10}" y="${y+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".5">${k?short(mx*k):'0'}</text>`;}).join('');
  const every=Math.max(1,Math.ceil(n/14));
  const xlb=items.map((x,i)=>(i%every===0||x.hl)
    ? `<text x="${X(i)}" y="${base+17}" text-anchor="middle" font-size="11" fill="currentColor"
         opacity="${x.hl?1:.45}" font-weight="${x.hl?700:400}">${x.lb}</text>`:'').join('');
  const paths=series.map((s,si)=>{
    const pts=items.map((x,i)=>[X(i),Y(x[s.k]||0)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${base} L${pts[0][0].toFixed(1)} ${base} Z`;
    const dots=n<=32?pts.map((p,i)=>items[i][s.k]?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${s.c}"></circle>`:'').join(''):'';
    return `<defs><linearGradient id="${id}_${si}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.c}" stop-opacity=".33"></stop>
        <stop offset="100%" stop-color="${s.c}" stop-opacity="0"></stop></linearGradient></defs>
      <path d="${area}" fill="url(#${id}_${si})"></path>
      <path d="${line}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>${dots}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px">${ticks}${paths}${xlb}</svg>`;
}
function donut(arr,total,kind){
  if(!total)return '<div class="empty">Нет данных за период</div>';
  const P=pal(kind), R=88, C=2*Math.PI*R, GAP=1.2;
  let off=0;
  const segs=arr.map(([c,v],i)=>{
    const len=Math.max(v/total*C,0.6);
    const dash=Math.max(len-GAP,0.4);
    const s=`<circle r="${R}" cx="120" cy="120" fill="none" stroke="${P[i%P.length]}" stroke-width="38"
      stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 120 120)"></circle>`;
    off+=len;return s;}).join('');
  return `<div style="display:flex;justify-content:center"><svg viewBox="0 0 240 240" style="width:250px;height:250px">${segs}
    <text x="120" y="114" text-anchor="middle" font-size="13" fill="currentColor" opacity=".55">итого</text>
    <text x="120" y="138" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${f(total)} ₽</text></svg></div>`;
}
function bucketDefs(){
  const out=[];
  if(PERIOD==='w'||PERIOD==='m'){
    const days=PERIOD==='w'?7:dim(MONTH);
    for(let k=0;k<days;k++){
      let ds;
      if(PERIOD==='w'){const e=isCur()?new Date(today):new Date(+MONTH.slice(0,4),+MONTH.slice(5,7),0);
        const d=new Date(e);d.setDate(d.getDate()-6+k);ds=iso(d);}
      else ds=MONTH+'-'+String(k+1).padStart(2,'0');
      out.push({lb:PERIOD==='w'?ds.slice(8)+'.'+ds.slice(5,7):String(k+1),hl:ds===iso(today),key:ds,day:true});}
  }else{
    const n=PERIOD==='3'?3:PERIOD==='y'?12:24;
    const end=new Date(+MONTH.slice(0,4),+MONTH.slice(5,7)-1,1);
    for(let k=n-1;k>=0;k--){const d=new Date(end);d.setMonth(d.getMonth()-k);const key=ym(d);
      out.push({lb:MN[d.getMonth()].slice(0,3),hl:key===MONTH,key,day:false});}
  }
  return out;
}
const inBucket=(t,b)=>b.day?t.date===b.key:t.date.slice(0,7)===b.key;
function buckets(){
  return bucketDefs().map(b=>{const list=S.tx.filter(t=>inBucket(t,b));
    return {...b,i:list.filter(x=>x.type==='in').reduce((s,x)=>s+txRub(x),0),
                 o:list.filter(x=>x.type==='out').reduce((s,x)=>s+txRub(x),0)};});
}
function catChart(kind,cats,h){
  if(!cats.length)return '<div class="empty">Нет операций за период</div>';
  const top=cats.slice(0,8), defs=bucketDefs(), P=pal(kind);
  const items=defs.map(b=>{
    const list=S.tx.filter(t=>t.type===kind&&inBucket(t,b));

    top.forEach(([c],ci)=>{o['c'+ci]=list.filter(t=>t.category===c).reduce((s,t)=>s+txRub(t),0);});
    return o;});
  return lineChart(items,h||300,top.map(([c],ci)=>({k:'c'+ci,c:P[ci%P.length]})));
}

/* ================= ПЛАНИРОВЩИК ФИНАНСОВЫХ ЦЕЛЕЙ ================= */
function periodsOf(g){
  const st=new Date(g.start), dl=new Date(g.deadline), arr=[];
  let cur=new Date(st), guard=0;
  while(cur<dl && guard++<800){
    let end=new Date(cur);
    if(g.step==='d')end.setDate(end.getDate()+1);
    else if(g.step==='w')end.setDate(end.getDate()+7);
    else if(g.step==='q')end.setMonth(end.getMonth()+3);
    else end.setMonth(end.getMonth()+1);
    if(end>dl)end=new Date(dl);
    arr.push({from:new Date(cur),to:new Date(end)});
    cur=new Date(end);
  }
  if(!arr.length)arr.push({from:st,to:dl});
  const n=arr.length;
  arr.forEach((p,k)=>{p.plan=g.target/n; p.planCum=g.target*(k+1)/n;
    p.label = g.step==='d' ? (String(p.to.getDate()).padStart(2,'0')+'.'+String(p.to.getMonth()+1).padStart(2,'0'))
            : g.step==='w' ? ('нед '+(k+1))
            : g.step==='q' ? ('кв '+(Math.floor(p.to.getMonth()/3)+1)+' '+String(p.to.getFullYear()).slice(2))
            : (MN[p.to.getMonth()].slice(0,3)+' '+String(p.to.getFullYear()).slice(2));});
  return arr;
}
const STEPN={d:['день','в день','дн.'],w:['неделя','в неделю','нед.'],m:['месяц','в месяц','мес.'],q:['квартал','в квартал','кв.']};
const gCon=g=>g.contribs||[];
const gcur=g=>g.cur||'RUB';
const gsym=g=>csym(gcur(g));
/* сумма взноса в валюте цели */
const cAmt=(g,c)=>{const cc=c.cur||'RUB';
  if(cc===gcur(g))return c.amount;
  return gcur(g)==='USD'?toUsd(c.amount,cc):toRub(c.amount,cc);};
const gf=(g,v)=>f(v)+' '+gsym(g);
const gFact=g=>gCon(g).reduce((s,c)=>s+cAmt(g,c),0);
function goalStat(g){
  const ps=periodsOf(g), t=iso(today);
  const st0=new Date(g.start), dl0=new Date(g.deadline);
  const total=Math.max(1,dl0-st0), gone=Math.min(Math.max(0,today-st0),total);
  const planNow=g.target*(gone/total);          /* где нужно быть именно сегодня */
  const fact=gFact(g);
  const left=Math.max(0,g.target-fact);
  const ahead=ps.filter(p=>iso(p.to)>t).length||1;
  const daysLeft=Math.ceil((new Date(g.deadline)-today)/864e5);
  const daysGone=Math.max(1,Math.ceil((today-new Date(g.start))/864e5));
  const perDay=fact/daysGone;                       // текущий темп, ₽/день
  const needDay=daysLeft>0?left/daysLeft:0;         // нужный темп
  const etaDays=perDay>0?Math.ceil(left/perDay):null;
  const eta=etaDays!=null?new Date(today.getTime()+etaDays*864e5):null;
  const etaDelta=eta?Math.ceil((eta-new Date(g.deadline))/864e5):null;
  // серия подряд выполненных периодов
  let streak=0;
  for(let k=ps.length-1;k>=0;k--){const p=ps[k];if(iso(p.to)>t)continue;
    const fp=gCon(g).filter(c=>k===0?c.date<=iso(p.to):(c.date>iso(p.from)&&c.date<=iso(p.to)))
      .reduce((s2,c)=>s2+cAmt(g,c),0);
    if(fp>=p.plan-0.5)streak++;else break;}
  return {ps,planNow,fact,left,ahead,daysLeft,daysGone,perDay,needDay,eta,etaDelta,streak,
    need:left/ahead, delta:fact-planNow, eff:planNow>0?fact/planNow*100:(fact?100:0),
    pct:g.target?Math.min(100,fact/g.target*100):0, planPct:g.target?Math.min(100,planNow/g.target*100):0};
}

/* удаление взноса вместе с проводкой */
function delContrib(g,cid){
  const c=gCon(g).find(x=>x.id===cid);
  if(c&&c.txId)S.tx=S.tx.filter(t=>t.id!==c.txId);
  g.contribs=gCon(g).filter(x=>x.id!==cid);
  (g.tasks||[]).forEach(tk=>{if(tk.contribId===cid){tk.done=false;tk.contribId=null;}});
  save();render();
}

let DRAG=null, PH=null;
let NOCLICK=false;
/* плавное перетаскивание строк: оригинал служит меткой места, за курсором летит призрак */
function dragRow(e,row,hostSel,onDrop){
  e.preventDefault(); e.stopPropagation();
  const r=row.getBoundingClientRect();
  const ghost=document.createElement('div');
  ghost.className='dragghost';
  ghost.style.width=r.width+'px';
  ghost.style.height=r.height+'px';
  ghost.textContent=row.textContent.replace(/⠿|✓/g,'').trim().slice(0,60);
  document.body.appendChild(ghost);
  const dy=e.clientY-r.top, dx=e.clientX-r.left;
  const put=(x,y)=>{ghost.style.left=(x-dx)+'px';ghost.style.top=(y-dy)+'px';};
  put(e.clientX,e.clientY);
  row.classList.add('rowmark');
  let moved=false;
  const move=ev=>{
    moved=true;NOCLICK=true;
    put(ev.clientX,ev.clientY);
    const hosts=[...document.querySelectorAll(hostSel)];
    let host=null;
    for(const h of hosts){const hr=h.getBoundingClientRect();
      if(ev.clientY>=hr.top-20&&ev.clientY<=hr.bottom+20){host=h;break;}}
    if(!host)return;
    const body=host.tBodies?(host.tBodies[0]||host):host;
    const sibs=[...body.children].filter(x=>x!==row&&(x.dataset.acc||x.dataset.plan));
    const after=sibs.find(x=>{const xr=x.getBoundingClientRect();return ev.clientY<xr.top+xr.height/2;});
    if(after){if(after.previousElementSibling!==row)body.insertBefore(row,after);}
    else if(body.lastElementChild!==row)body.appendChild(row);
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    ghost.remove(); row.classList.remove('rowmark');
    if(moved)onDrop();
    setTimeout(()=>{NOCLICK=false;},60);
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}

function initDnD(){
  document.addEventListener('pointerdown',e=>{
    const grip=e.target.closest('.grip2'); if(!grip)return;
    const card=grip.closest('.card[data-card]'); if(!card)return;
    e.preventDefault();
    DRAG=card;
    const r=card.getBoundingClientRect();
    PH=document.createElement('div');
    PH.className='cardph';
    PH.style.height=r.height+'px';
    card.parentElement.insertBefore(PH,card);
    card.classList.add('dragfly');
    card.style.width=r.width+'px';
    card.style.height=r.height+'px';
    const dx=e.clientX-r.left, dy=e.clientY-r.top;
    const move=ev=>{
      card.style.left=(ev.clientX-dx)+'px';
      card.style.top=(ev.clientY-dy)+'px';
      const cols=[...document.querySelectorAll('.grid > .col')];
      let col=cols.find(c=>{const cr=c.getBoundingClientRect();return ev.clientX>=cr.left-9&&ev.clientX<=cr.right+9;})||PH.parentElement;
      const others=[...col.children].filter(x=>x!==PH&&x!==card&&x.classList.contains('card'));
      const after=others.find(x=>{const xr=x.getBoundingClientRect();return ev.clientY<xr.top+xr.height/2;});
      if(after)col.insertBefore(PH,after); else col.appendChild(PH);
      cols.forEach(c=>c.classList.toggle('dropzone',c===col));
    };
    const up=()=>{
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      card.classList.remove('dragfly');
      card.style.cssText='';
      PH.parentElement.insertBefore(card,PH);
      PH.remove();PH=null;DRAG=null;
      document.querySelectorAll('.col').forEach(c=>c.classList.remove('dropzone'));
      saveLayout();
    };
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

              ['Долги',f(D)+' ₽',D?'out':'in'],

      :`<div class="empty" data-empty="acc" data-sect="${sec.id}" style="padding:10px 6px;font-size:12px">Нажмите и добавьте счёт</div>`}</div>`;

function rPlan(){
  const t0=iso(today);
  PDATE=t0;
  const tasks=S.plan.filter(x=>x.type!=='note'&&x.date===PDATE);
  const notes=S.plan.filter(x=>x.type==='note'&&!x.done).sort((a,b)=>a.date.localeCompare(b.date));
  const overdue=S.plan.filter(x=>x.type!=='note'&&!x.done&&x.date<t0).sort((a,b)=>a.date.localeCompare(b.date));

  /* задачи целей на эту дату — единый туннель: цель → задачи по датам → план дня */
  const gt=[];S.goals.forEach(g=>(g.tasks||[]).forEach(tk=>{if(tk.due===PDATE)gt.push({g,tk});}));
  let h=`<div class="plab">Чек-лист · план на день</div>`;
  h+= gt.map(o=>`<div class="pay" data-gopen="${o.g.id}|${o.tk.id}">
        <div class="ck2 ${o.tk.done?'on':''}" data-gtick="${o.g.id}|${o.tk.id}"
          style="${o.tk.done?'background:'+(o.g.color||'var(--in)')+';border-color:'+(o.g.color||'var(--in)'):''}">✓</div>
        <div class="nm" style="${o.tk.done?'opacity:.45;text-decoration:line-through':''}">
          <span class="pg-d" style="background:${o.g.color||'var(--acc)'};margin-right:7px"></span>${o.tk.title}
          <span class="hint">· ${o.g.name}</span></div>
        <div class="am">${o.tk.amount?f(o.tk.amount)+' '+gsym(o.g):''}</div></div>`).join('');
  h+= tasks.length ? tasks.map(x=>`<div class="pay" data-plan="${x.id}">
        <span class="pgrip" title="перетащить">⠿</span>
        <div class="ck2 ${x.done?'on':''}" data-ptick="${x.id}">✓</div>
        <div class="nm" style="${x.done?'opacity:.45;text-decoration:line-through':''}">${x.title}${badges(x)}</div>
        <div class="am">${x.amount?f(x.amount)+' ₽':''}</div></div>`).join('')
      : (gt.length||overdue.length?'':`<div class="empty" data-empty="plan" style="padding:14px 6px">Нажмите здесь и добавьте пункт плана</div>`);
  h+= overdue.map(x=>`<div class="pay" data-plan="${x.id}">
        <div class="ck2" data-ptick="${x.id}">✓</div>
        <div class="nm">${x.title}</div>
        <div class="am">${x.amount?f(x.amount)+' ₽ ':''}<span class="pn-d out">${dlb(x.date)}</span></div></div>`).join('');
  h+=`<div class="plab" style="margin-top:14px">Заметки · висят до выполнения${notes.length?' · '+notes.length:''}</div>`;
  h+= notes.length ? notes.map(x=>`<div class="pnote" data-plan="${x.id}">
        <div class="ck2 sm" data-ptick="${x.id}">✓</div>
        <span class="pn-t">${x.title}${badges(x)}</span>
        <span class="pn-d ${x.date<t0?'out':x.date===t0?'in':''}">${x.date===t0?'сегодня':dlb(x.date)}</span></div>`).join('')
      : `<div class="empty" data-empty="note" style="padding:12px 6px;font-size:12px">Заметок нет — нажмите «Заметка»</div>`;
  $('planBody').innerHTML=h;
  const all=[...tasks,...gt.map(o=>o.tk),...overdue];
  const done=all.filter(x=>x.done).length;
  const sum=all.reduce((a,x)=>a+(x.amount||0),0);
  const sumDone=all.filter(x=>x.done).reduce((a,x)=>a+(x.amount||0),0);
  $('planF').innerHTML=`<span class="hint">выполнено ${done} из ${all.length}${notes.length?' · заметок '+notes.length:''}</span>
    <span>${sum?f(sumDone)+' из '+f(sum)+' ₽':''}</span>`;
}
function planForm(item,isNote,back){
  const isNew=!item||!S.plan.some(x=>x.id===item.id);
  const ret=()=>{closeModal();if(back)back();};
  item=item||{id:uid(),title:'',amount:0,done:false,date:PDATE||iso(today),type:isNote?'note':'task'};
  if(!item.imgs)item.imgs=[];
  let imgs=[...item.imgs], text=item.text||'';
  const html=`<div class="f"><label>${item.type==='note'?'Текст заметки':'Что нужно сделать'}</label>
      <input id="pt" value="${esc(item.title)}"></div>
    <div class="f2">
      <div class="f" ${item.type==='note'?'style="display:none"':''}><label>Сумма, ₽ (можно 0)</label>
        <input type="number" id="pa" value="${item.amount||0}"></div>
      <div class="f"><label>Дата</label><input type="date" id="pd" value="${item.date}"></div></div>
    <div class="f"><label>Описание — большой текст, в модуле не занимает места</label>
      <textarea id="ptx" rows="8" placeholder="">${esc(text).replace(/&quot;/g,'"')}</textarea></div>
    <div class="f"><label>Изображения <span class="hint" id="imgn"></span></label>
      <div id="imgs" class="imgs"></div>
      <button id="pimgBtn" class="dashed" style="width:100%;margin-top:6px">＋ Добавить изображение</button>
      <input type="file" id="pimg" accept="image/*" multiple style="display:none"></div>
    <div class="f chk"><input type="checkbox" id="pdone" ${item.done?'checked':''}>
      <label for="pdone">Выполнено${item.done?' — снимите галочку, чтобы восстановить':''}</label></div>`;
  const foot=[];
  if(!isNew)foot.push({t:'Удалить',d:1,f:()=>uiConfirm('Удалить пункт?',()=>{
    S.plan=S.plan.filter(x=>x.id!==item.id);save();render();ret();})});
  foot.push({t:'Отмена',f:ret},{t:'Сохранить',p:1,f:()=>{
    const t2=$('pt').value.trim();if(!t2)return uiAlert('Введите текст');
    item.title=t2;item.amount=item.type==='note'?0:(+$('pa').value||0);item.date=$('pd').value;
    item.done=$('pdone').checked;item.text=$('ptx').value;item.imgs=imgs;
    if(!S.plan.some(x=>x.id===item.id))S.plan.push(item);
    try{save();}catch(e){return uiAlert('Не хватило места в хранилище браузера. Удалите часть изображений или сделайте экспорт.');}
    render();ret();}});
  openModal(isNew?(item.type==='note'?'Новая заметка':'Новый пункт плана'):(item.title||'Пункт плана'),html,foot,false,true);
  const drawImgs=()=>{
    $('imgn').textContent=imgs.length?imgs.length+' шт.':'';
    $('imgs').innerHTML=imgs.map((src,i)=>`<div class="imgc">
      <img src="${src}" data-big="${i}">
      <span class="imgx" data-rmimg="${i}">✕</span></div>`).join('');
  };drawImgs();
  $('pimgBtn').onclick=()=>$('pimg').click();
  $('pimg').onchange=e=>{
    const files=[...e.target.files];
    let left=files.length;
    files.forEach(fl=>{
      const r=new FileReader();
      r.onload=()=>{
        const im=new Image();
        im.onload=()=>{
          const MAX=1400, k=Math.min(1,MAX/Math.max(im.width,im.height));
          const cv=document.createElement('canvas');
          cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
          imgs.push(cv.toDataURL('image/jpeg',0.72));
          if(--left===0)drawImgs(); else drawImgs();
        };
        im.src=r.result;
      };
      r.readAsDataURL(fl);
    });
    e.target.value='';
  };
  $('imgs').onclick=e=>{
    const rm=e.target.closest('[data-rmimg]');
    if(rm){imgs.splice(+rm.dataset.rmimg,1);drawImgs();return;}
    const big=e.target.closest('[data-big]');
    if(big)openModal2('Изображение',`<img src="${imgs[+big.dataset.big]}" style="width:100%;border-radius:12px">`,
      [{t:'Закрыть',p:1,f:closeDlg}],760);
  };
}

function rStrip(){
  const g=S.goals.find(x=>x.fav);
  const el=$('gstrip');
  if(!g){el.style.display='none';el.innerHTML='';return;}
  el.style.display='';
  const st=goalStat(g), nm=(STEPN[g.step]||STEPN.m);
  /* цвет по степени отклонения: в графике — зелёный, среднее — жёлтый, сильное — красный */
  const k = st.planNow>0 ? st.fact/st.planNow : (st.fact>0?1:1);
  const col = k>=0.95 ? 'var(--in)' : k>=0.75 ? 'var(--warn)' : 'var(--out)';
  el.innerHTML=`<div class="gs-l" style="background:${g.color||'var(--acc)'}"></div>
    <div class="gs-n"><span class="gs-star">★</span>${g.name}</div>
    <div class="gs-b">
      <div class="pbig"><i style="width:${st.pct}%;background:${col}"></i>
        <em style="left:25%"></em><em style="left:50%"></em><em style="left:75%"></em>
        <u style="left:${st.planPct}%;background:${col}" title="здесь нужно быть сегодня"></u>
        <span>${gf(g,st.fact)} из ${gf(g,g.target)} · ${st.pct.toFixed(0)}%</span></div></div>
    <div class="gs-i"><div class="l">${st.delta>=0?'опережение':'отставание'}</div>
      <div class="v ${st.delta>=0?'in':'out'}">${st.delta>=0?'+':'−'}${gf(g,Math.abs(st.delta))}</div></div>
    <div class="gs-i"><div class="l">всего остаток</div><div class="v">${gf(g,st.left)}</div></div>
    <div class="gs-i"><div class="l">до дедлайна</div>
      <div class="v">${st.daysLeft>0?st.daysLeft+' дн.':'срок вышел'}</div></div>
    <button class="gs-go">Открыть цель</button>`;
}

async function fetchRates(silent){
  try{
    const r=await fetch('https://api.exchangerate-api.com/v4/latest/RUB');const j=await r.json();
    S.rates=S.rates||{};
    curList().forEach(c=>{if(c==='RUB')return;
      if(c==='USDT'){if(j.rates.USD)S.rates.USDT=+(1/j.rates.USD).toFixed(2);return;}
      if(c==='BTC')return;
      if(j.rates[c])S.rates[c]=+(1/j.rates[c]).toFixed(2);});
    if(S.rates.USD)S.settings.rate=S.rates.USD;
    if(curList().includes('BTC')){
      try{const b=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=rub');
        const bj=await b.json();if(bj.bitcoin&&bj.bitcoin.rub)S.rates.BTC=Math.round(bj.bitcoin.rub);}catch(e){}
    }
    S.settings.ratesDate=iso(today);save();render();
    if(!silent)uiAlert('Курсы обновлены: '+curList().filter(c=>c!=='RUB')
      .map(c=>csym(c)+' '+f(rate(c))).join(', '));
  }catch(e){ if(!silent)uiAlert('Не удалось получить курсы — нет доступа к сети. Значения оставлены прежние.'); }
}

/* ================= ОБЛАКО (Supabase) ================= */
const SUPA_URL='https://oxxmlsnrouluikptpkgs.supabase.co';
const SUPA_KEY='sb_publishable_fZiGLPLkA3FplsnLBFyxnA_zhNeFupY';
const FN=SUPA_URL+'/functions/v1/quick-action';
const BOT_NAME='personalfinanceeee_bot';
let SB=null, CLOUD={state:'off',msg:'выключено',at:null}, ME=null, LASTERR='';
function cloudInit(){
  if(!window.supabase){setCloud('off','нет связи');return;}
  try{ SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
       setCloud('wait','подключение…'); cloudBoot(); }
  catch(e){ setCloud('err','ошибка подключения'); }
}
async function useTokens(j){
  if(!j||!j.access_token)throw new Error((j&&j.error)||'нет токена');
  const {error:se}=await SB.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
  if(se)throw new Error('сессия: '+se.message);
  const {data:{user},error:ue}=await SB.auth.getUser();
  if(ue||!user)throw new Error('проверка входа: '+((ue&&ue.message)||'пользователь не найден'));
  ME=j.name||j.username||'Telegram'; LASTERR='';
}
async function tgLogin(){
  const TGW=window.Telegram&&window.Telegram.WebApp;
  if(!TGW||!TGW.initData){LASTERR='открыто не из Telegram';return false;}
  try{
    setCloud('wait','вход через Telegram…');
    const r=await fetch(FN,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
      body:JSON.stringify({initData:TGW.initData})});
    let j={}; try{ j=await r.json(); }catch(e){ throw new Error('ответ не JSON, код '+r.status); }
    if(!r.ok)throw new Error((j.error||'ошибка')+' · код '+r.status);
    await useTokens(j); return true;
  }catch(e){ LASTERR=String(e.message||e); setCloud('err','вход не удался'); return false; }
}
window.onTelegramAuth=async function(user){
  try{
    setCloud('wait','вход через Telegram…');
    const r=await fetch(FN,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
      body:JSON.stringify({widget:user})});
    const j=await r.json();
    if(!r.ok)throw new Error((j.error||'ошибка')+' · код '+r.status);
    await useTokens(j); await cloudPull(false); uiAlert('Вход выполнен: '+ME);
  }catch(e){ LASTERR=String(e.message||e); setCloud('err','вход не удался'); uiAlert('Не удалось войти. '+LASTERR); }
};
function setCloud(st,msg){
  CLOUD.state=st;CLOUD.msg=msg;
  const b=$('cloudBtn'); if(!b)return;
  b.textContent = st==='ok'?'☁':(st==='wait'?'◌':(st==='err'?'⚠':'☁'));
  b.className = 'cloud-'+st;
  b.title='Облако: '+msg;
}
async function cloudBoot(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){ if(!await tgLogin()){setCloud('err','нужен вход');return;} }
  await cloudPull(true);
}
/* забрать данные из облака */
async function cloudPull(silent){
  if(!SB)return;
  try{
    let {data:{user}}=await SB.auth.getUser();
    if(!user){ if(await tgLogin()){ user=(await SB.auth.getUser()).data.user; } }
    if(!user){setCloud('err','нужен вход');return;}
    const {data,error}=await SB.from('finance_state').select('data,rev').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    const localRev=+(S.rev||0);
    if(data&&+data.rev>localRev){
      S=data.data; if(!S.plan)S.plan=[]; if(!S.goals)S.goals=[];
      localStorage.setItem(KEY,JSON.stringify(S));
      render();
      setCloud('ok','данные из облака');
      if(!silent)uiAlert('Загружены данные из облака.');
    }else{
      await cloudPush(true);
      setCloud('ok','синхронизировано');
    }
    CLOUD.at=new Date();
  }catch(e){ setCloud('err','нет связи'); }
}
/* отправить данные в облако */
let pushT=null;
async function cloudPush(now){
  if(!SB)return;
  clearTimeout(pushT);
  const run=async()=>{
    try{
      const {data:{user}}=await SB.auth.getUser();
      if(!user){setCloud('err','нужен вход');return;}
      S.rev=Date.now();
      localStorage.setItem(KEY,JSON.stringify(S));
      const {error}=await SB.from('finance_state')
        .upsert({user_id:user.id,data:S,rev:S.rev},{onConflict:'user_id'});
      if(error)throw error;
      CLOUD.at=new Date(); setCloud('ok','синхронизировано '+new Date().toLocaleTimeString('ru-RU').slice(0,5));
    }catch(e){ setCloud('err','не отправлено'); }
  };
  if(now)return run();
  pushT=setTimeout(run,1500);
}
/* окно настройки облака */
function cloudModal(){
  const inTG=!!(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData);
  const err=LASTERR?`<div class="kpi" style="margin-bottom:12px;border-color:var(--out)">

    + (inTG

         <div style="margin-bottom:12px"><button id="cTg" class="pri" style="width:100%">Войти через Telegram</button></div>`
      : `<p class="hint" style="margin-bottom:12px">Войдите через Telegram — данные будут те же, что в мини-аппе.</p>
         <div class="f"><div id="tgw"></div></div>
         <details style="margin-bottom:12px"><summary class="hint" style="cursor:pointer">Вход по почте — отдельный аккаунт</summary>
           <div class="f2" style="margin-top:10px"><div class="f"><label>Почта</label><input id="ce" placeholder="you@mail.com"></div>
             <div class="f"><label>Пароль</label><input id="cp" type="password" placeholder="от 6 символов"></div></div>
           <div style="display:flex;gap:8px;flex-wrap:wrap">
             <button id="cSignUp">Создать аккаунт</button><button id="cSignIn" class="pri">Войти</button>
             <button id="cOut">Выйти</button></div></details>`)
    + `<div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="cPull">Забрать из облака</button><button id="cPush">Отправить в облако</button></div>`;
  openModal('Облако',html,[{t:'Закрыть',f:closeModal}]);
  const st=m=>{const el=$('cState');if(el)el.textContent=m;};
  if($('tgw')){
    const sc=document.createElement('script');
    sc.async=true; sc.src='https://telegram.org/js/telegram-widget.js?22';
    sc.setAttribute('data-telegram-login',BOT_NAME);
    sc.setAttribute('data-size','large');
    sc.setAttribute('data-userpic','false');
    sc.setAttribute('data-onauth','onTelegramAuth(user)');
    $('tgw').appendChild(sc);
  }
  if($('cTg'))$('cTg').onclick=async()=>{
    if(!await tgLogin())return uiAlert('Не удалось войти. '+LASTERR);
    await cloudPull(false); st(CLOUD.msg); uiAlert('Вход выполнен: '+ME);};
  if($('cSignUp'))$('cSignUp').onclick=async()=>{
    const {error}=await SB.auth.signUp({email:$('ce').value.trim(),password:$('cp').value});
    if(error)return uiAlert('Не вышло: '+error.message);
    uiAlert('Аккаунт создан. Теперь нажмите «Войти».');};
  if($('cSignIn'))$('cSignIn').onclick=async()=>{
    const {error}=await SB.auth.signInWithPassword({email:$('ce').value.trim(),password:$('cp').value});
    if(error)return uiAlert('Не вышло: '+error.message);
    ME=$('ce').value.trim(); await cloudPull(false); st(CLOUD.msg);};
  if($('cOut'))$('cOut').onclick=async()=>{await SB.auth.signOut();ME=null;setCloud('off','выход выполнен');st('выход выполнен');};
  $('cPull').onclick=async()=>{await cloudPull(false);st(CLOUD.msg);};
  $('cPush').onclick=async()=>{await cloudPush(true);st(CLOUD.msg);uiAlert('Данные отправлены в облако.');};
}
